[tool:pytest]
# pytest configuration for HarborPilot E2E tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --maxfail=5
    --durations=10
    --color=yes
    --html=reports/report.html
    --self-contained-html

# Markers
markers =
    smoke: Marks tests as smoke tests (quick sanity checks)
    regression: Marks tests as regression tests
    integration: Marks tests as integration tests
    dashboard: Marks tests that test Dashboard functionality
    workflow: Marks tests that test complete workflows
    slow: Marks tests that take a long time to run
    flaky: Marks tests that are known to be unstable
    mock_ai: Marks tests that use mocked AI responses
    real_ai: Marks tests that require real AI services
    cleanup: Marks tests that perform cleanup operations

# Timeout settings
timeout = 300
timeout_method = thread

# Rerun failed tests
reruns = 2
reruns_delay = 5

# Async test configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test order
dist = no
loadfile = true

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:playwright._impl._api_types
